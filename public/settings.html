<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NEXUS — Paramètres</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060913;--blue:#61A1F0;--cyan:#00d4ff;--purple:#a855f7;
  --green:#3fb950;--red:#f85149;--orange:#f0a040;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(97,161,240,0.15);
  --text:#e2eaff;--muted:#6b7fa3;--sidebar:220px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
canvas#bg{position:fixed;inset:0;z-index:0}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(97,161,240,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(97,161,240,0.025) 1px,transparent 1px);
  background-size:60px 60px}
.layout{position:relative;z-index:10;display:flex;height:100vh}

/* Sidebar */
.sidebar{width:var(--sidebar);flex-shrink:0;padding:20px 0;display:flex;flex-direction:column;border-right:1px solid rgba(97,161,240,0.08);background:rgba(6,9,19,0.6);backdrop-filter:blur(20px)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 20px 24px}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(97,161,240,0.4)}
.logo-mark svg{width:15px;height:15px}
.logo-text{font-size:15px;font-weight:700}.logo-text span{color:var(--blue)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item:hover{background:rgba(97,161,240,0.07);color:var(--text)}
.nav-item.active{background:rgba(97,161,240,0.12);color:var(--blue)}
.nav-sep{height:1px;background:rgba(97,161,240,0.08);margin:8px 10px}
.sidebar-bottom{padding:10px 10px 0}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,0.2);border-radius:10px;border:1px solid rgba(97,161,240,0.08)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-sub{font-size:10px;color:var(--muted)}.user-sub.active{color:var(--green)}
.logout-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;display:flex;align-items:center;transition:color .15s}
.logout-btn:hover{color:var(--red)}.logout-btn svg{width:14px;height:14px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.header{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid rgba(97,161,240,0.08);background:rgba(6,9,19,0.4);backdrop-filter:blur(12px);flex-shrink:0}
.header-title{font-size:15px;font-weight:700}

/* Content */
.content{flex:1;overflow-y:auto;padding:28px 24px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(97,161,240,0.2);border-radius:2px}
.content-inner{max-width:560px}

/* Section card */
.section-card{
  background:rgba(0,0,0,0.2);border:1px solid rgba(97,161,240,0.1);
  border-radius:16px;padding:22px 24px;margin-bottom:16px;
}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.section-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-icon svg{width:15px;height:15px}
.section-title{font-size:14px;font-weight:700}
.section-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* Info rows */
.info-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(97,161,240,0.06)}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-key{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-size:11px}
.info-val{font-size:13px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700}
.badge-green{background:rgba(63,185,80,0.12);border:1px solid rgba(63,185,80,0.25);color:var(--green)}
.badge-red{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.25);color:var(--red)}
.badge-muted{background:rgba(107,127,163,0.1);border:1px solid rgba(107,127,163,0.15);color:var(--muted)}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* Form */
.field{margin-bottom:14px}
.field:last-of-type{margin-bottom:0}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px;pointer-events:none}
.form-input{
  width:100%;height:42px;padding:0 14px 0 38px;
  background:rgba(0,0,0,0.35);border:1px solid rgba(97,161,240,0.15);
  border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(97,161,240,0.1)}
.form-input::placeholder{color:#2d3f5c}

.btn{
  display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 18px;
  border:none;border-radius:10px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;transition:all .2s;
}
.btn svg{width:14px;height:14px}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 0 16px rgba(97,161,240,0.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(97,161,240,0.4)}
.btn-primary:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-danger{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.25);color:var(--red)}
.btn-danger:hover{background:rgba(248,81,73,0.18)}

.msg{padding:10px 14px;border-radius:9px;font-size:13px;margin-top:14px;display:none;animation:fadeIn .2s ease}
.msg.error{background:rgba(248,81,73,0.1);border:1px solid rgba(248,81,73,0.3);color:var(--red)}
.msg.success{background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.3);color:var(--green)}
.msg.visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

/* Sub countdown */
.sub-timer{
  margin-top:10px;padding:10px 14px;
  background:rgba(63,185,80,0.06);border:1px solid rgba(63,185,80,0.15);
  border-radius:9px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.sub-timer-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="grid"></div>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <span class="logo-text">NEX<span>US</span></span>
    </div>
    <nav class="nav">
      <a class="nav-item" href="/search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Recherche
      </a>
      <a class="nav-item" href="/history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-4.5"/><polyline points="3 3 3 7 7 7"/></svg>Historique
      </a>
      <a class="nav-item active" href="/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Paramètres
      </a>
      <a class="nav-item" href="/activate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Abonnement
      </a>
      <div class="nav-sep"></div>
      <a class="nav-item" id="admin-link" href="/admin" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Administration
      </a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">—</div>
          <div class="user-sub" id="user-sub">…</div>
        </div>
        <button class="logout-btn" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="header"><span class="header-title">Paramètres du compte</span></div>

    <div class="content">
      <div class="content-inner">

        <!-- Account info -->
        <div class="section-card">
          <div class="section-head">
            <div class="section-icon" style="background:rgba(97,161,240,0.1);color:var(--blue)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div>
              <div class="section-title">Informations du compte</div>
              <div class="section-sub">Vos données d'identification</div>
            </div>
          </div>
          <div class="info-row"><span class="info-key">Pseudo</span><span class="info-val" id="info-username">—</span></div>
          <div class="info-row"><span class="info-key">Email</span><span class="info-val" id="info-email">—</span></div>
          <div class="info-row"><span class="info-key">Rôle</span><span class="info-val" id="info-role">—</span></div>
          <div class="info-row"><span class="info-key">Abonnement</span><span class="info-val" id="info-sub">—</span></div>
          <div id="sub-timer" class="sub-timer" style="display:none">
            <div class="sub-timer-dot"></div>
            <span id="sub-timer-text"></span>
          </div>
        </div>

        <!-- Change password -->
        <div class="section-card">
          <div class="section-head">
            <div class="section-icon" style="background:rgba(168,85,247,0.1);color:var(--purple)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div>
              <div class="section-title">Changer le mot de passe</div>
              <div class="section-sub">Votre session sera terminée après le changement</div>
            </div>
          </div>

          <div id="pw-msg" class="msg"></div>

          <div class="field">
            <label>Mot de passe actuel</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="form-input" type="password" id="cur-pw" placeholder="Mot de passe actuel" autocomplete="current-password"/>
            </div>
          </div>
          <div class="field">
            <label>Nouveau mot de passe</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="form-input" type="password" id="new-pw" placeholder="6 caractères minimum" autocomplete="new-password"/>
            </div>
          </div>
          <div class="field" style="margin-bottom:16px">
            <label>Confirmer le nouveau mot de passe</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="form-input" type="password" id="conf-pw" placeholder="Répétez le nouveau mot de passe" autocomplete="new-password"/>
            </div>
          </div>
          <button class="btn btn-primary" id="btn-pw" onclick="changePassword()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Mettre à jour
          </button>
        </div>

        <!-- Danger zone -->
        <div class="section-card" style="border-color:rgba(248,81,73,0.12)">
          <div class="section-head">
            <div class="section-icon" style="background:rgba(248,81,73,0.1);color:var(--red)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div>
              <div class="section-title">Zone de danger</div>
              <div class="section-sub">Actions irréversibles</div>
            </div>
          </div>
          <button class="btn btn-danger" onclick="doLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Se déconnecter
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
function rand(a,b){return a+Math.random()*(b-a)}
class Particle{constructor(){this.reset()}reset(){this.x=rand(0,W);this.y=rand(0,H);this.vx=rand(-.2,.2);this.vy=rand(-.4,-.05);this.r=rand(.5,1.5);this.life=rand(.2,.7);this.decay=rand(.001,.003);this.hue=rand(200,230)}update(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;if(this.life<=0||this.y<-10)this.reset()}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`hsla(${this.hue},80%,70%,${this.life})`;ctx.fill()}}
for(let i=0;i<60;i++)particles.push(new Particle());
function animate(){ctx.fillStyle='rgba(6,9,19,0.12)';ctx.fillRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}
animate();

function showMsg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className=`msg ${type} visible`;setTimeout(()=>el.classList.remove('visible'),5000)}

fetch('/api/me').then(r=>r.json()).then(d=>{
  if(!d.user){window.location.href='/login';return}
  const u=d.user;
  document.getElementById('user-name').textContent=u.username;
  document.getElementById('user-avatar').textContent=u.username[0].toUpperCase();
  document.getElementById('info-username').textContent=u.username;
  document.getElementById('info-email').textContent=u.email;

  if(u.is_admin){
    document.getElementById('user-sub').textContent='Administrateur';
    document.getElementById('user-sub').classList.add('active');
    document.getElementById('admin-link').style.display='flex';
    document.getElementById('info-role').innerHTML='<span class="badge badge-green">Administrateur</span>';
    document.getElementById('info-sub').innerHTML='<span class="badge badge-green">Accès illimité</span>';
  } else if(u.subscribed){
    const exp=new Date(u.subscription_expires_at+'Z');
    const days=Math.ceil((exp-Date.now())/86400000);
    document.getElementById('user-sub').textContent=`Actif • ${days}j`;
    document.getElementById('user-sub').classList.add('active');
    document.getElementById('info-role').innerHTML='<span class="badge badge-muted">Utilisateur</span>';
    document.getElementById('info-sub').innerHTML=`<span class="badge badge-green"><span class="badge-dot"></span>Actif</span>`;
    document.getElementById('sub-timer').style.display='flex';
    document.getElementById('sub-timer-text').textContent=`Expire le ${exp.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})} — ${days} jour${days>1?'s':''} restant${days>1?'s':''}`;
  } else {
    document.getElementById('user-sub').textContent='Aucun abonnement';
    document.getElementById('info-role').innerHTML='<span class="badge badge-muted">Utilisateur</span>';
    document.getElementById('info-sub').innerHTML='<span class="badge badge-red">Inactif</span>';
  }
});

async function changePassword(){
  const cur=document.getElementById('cur-pw').value;
  const np=document.getElementById('new-pw').value;
  const conf=document.getElementById('conf-pw').value;
  if(!cur||!np||!conf) return showMsg('pw-msg','Tous les champs sont requis','error');
  if(np!==conf) return showMsg('pw-msg','Les mots de passe ne correspondent pas','error');
  if(np.length<6) return showMsg('pw-msg','Minimum 6 caractères','error');

  const btn=document.getElementById('btn-pw');
  btn.disabled=true;btn.textContent='Mise à jour…';
  try{
    const r=await fetch('/api/user/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:cur,new_password:np})});
    const d=await r.json();
    if(!r.ok) return showMsg('pw-msg',d.error,'error');
    showMsg('pw-msg','Mot de passe mis à jour. Redirection…','success');
    setTimeout(()=>window.location.href='/login',1800);
  }catch{showMsg('pw-msg','Erreur réseau','error')}
  finally{btn.disabled=false;btn.textContent='Mettre à jour'}
}

async function doLogout(){await fetch('/api/auth/logout',{method:'POST'});window.location.href='/login'}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.type==='password')changePassword()})
</script>
</body>
</html>
